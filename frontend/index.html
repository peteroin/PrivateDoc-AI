<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Private Data Chatbot</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="logo">
                🔐 Private AI
            </div>

            <button class="new-chat" onclick="newChat()">
                + New Chat
            </button>

            <label class="upload-button">
                📁 Upload Document

                <input
                    type="file"
                    id="fileInput"
                    accept=".txt,.pdf,.docx"
                    onchange="uploadDocument()"
                >
            </label>

            <div id="uploadStatus"></div>

        <div class="sidebar-section">

            <div class="documents-header">

                <p>Private Documents</p>

                <button
                    class="refresh-button"
                    onclick="loadDocuments()"
                    title="Refresh"
                >
                    ↻
                </button>

            </div>


            <div id="documentList">

                <div class="empty-documents">
                    No documents loaded
                </div>

            </div>

        </div>

            <div class="sidebar-bottom">
                <small>
                    Private Data Assistant
                </small>
            </div>

        </aside>


        <!-- Main Chat -->
        <main class="chat-container">

            <!-- Header -->
            <header class="chat-header">

                <div>
                    <h2>Private Data Chatbot</h2>
                    <span>Ask questions about your private data</span>
                </div>

                <div class="status">
                    <span class="status-dot"></span>
                    Online
                </div>

            </header>


            <!-- Messages -->
            <section id="chatBox" class="chat-box">

                <div class="message bot">

                    <div class="avatar">
                        AI
                    </div>

                    <div class="bubble">
                        <p>
                            Hello! 👋
                        </p>

                        <p>
                            I can answer questions using the
                            private hospital and company data.
                        </p>
                    </div>

                </div>

            </section>


            <!-- Input -->
            <div class="input-area">

                <div class="input-wrapper">

                    <textarea
                        id="messageInput"
                        placeholder="Ask something about the private data..."
                        rows="1"
                        onkeydown="handleKey(event)"
                    ></textarea>

                    <button
                        id="sendButton"
                        onclick="sendMessage()"
                    >
                        ➤
                    </button>

                </div>

                <p class="disclaimer">
                    Answers are generated from the provided private data.
                </p>

            </div>

        </main>

    </div>

    <script src="/static/app.js"></script>

</body>

</html>
